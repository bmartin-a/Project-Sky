# Project-Sky full on-premise stack.
#   cp .env.example .env   # then edit secrets
#   docker compose up --build

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projectsky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectsky}
      POSTGRES_DB: ${POSTGRES_DB:-projectsky}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projectsky}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        PROJECT: ProjectSky.Api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # This base compose is the local-dev quickstart: Development enables the
      # no-login LocalDev auth mode. Production uses docker-compose.prod.yml.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-projectsky};Username=${POSTGRES_USER:-projectsky};Password=${POSTGRES_PASSWORD:-projectsky}
      ConnectionStrings__Redis: redis:6379
      Auth__Mode: ${Auth__Mode:-LocalDev}
      Nvd__ApiKey: ${Nvd__ApiKey:-}
      Defender__TenantId: ${Defender__TenantId:-}
      Defender__ClientId: ${Defender__ClientId:-}
      Defender__ClientSecret: ${Defender__ClientSecret:-}
      DataProtection__KeyPath: /keys
    volumes:
      - dp-keys:/keys
    ports:
      # Host port is configurable (set API_PORT in .env) to avoid conflicts.
      # The UI at :3000 reaches the API internally regardless of this mapping.
      - "${API_PORT:-8080}:8080"
    # Raw sockets for nmap SYN/OS detection (used by the API only if it ever
    # scans directly; kept for parity). The nmap binary is setcap'd in the image.
    cap_add:
      - NET_RAW

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        PROJECT: ProjectSky.Worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      zap:
        condition: service_started
    environment:
      ASPNETCORE_URLS: http://+:8081
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-projectsky};Username=${POSTGRES_USER:-projectsky};Password=${POSTGRES_PASSWORD:-projectsky}
      ConnectionStrings__Redis: redis:6379
      Nvd__ApiKey: ${Nvd__ApiKey:-}
      Zap__BaseUrl: http://zap:8080
      Zap__ApiKey: ${Zap__ApiKey:-change-me}
      Defender__TenantId: ${Defender__TenantId:-}
      Defender__ClientId: ${Defender__ClientId:-}
      Defender__ClientSecret: ${Defender__ClientSecret:-}
    # The worker runs the scans, so it needs raw-socket capability.
    cap_add:
      - NET_RAW

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:80"

  # OWASP ZAP daemon for active web scanning (Milestone 2).
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.key=${Zap__ApiKey:-change-me}
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    # Internal only; the worker reaches it at http://zap:8080. Do not expose
    # this port publicly — the ZAP API can drive requests to arbitrary hosts.

volumes:
  postgres-data:
  redis-data:
  dp-keys:
