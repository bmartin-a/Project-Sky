name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ProjectSky.slnx

      - name: Build
        run: dotnet build ProjectSky.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ProjectSky.slnx -c Release --no-build --verbosity normal

  docker-build:
    name: Validate Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f docker/Dockerfile.backend --build-arg PROJECT=ProjectSky.Api -t projectsky-api .

      - name: Build Worker image
        run: docker build -f docker/Dockerfile.backend --build-arg PROJECT=ProjectSky.Worker -t projectsky-worker .
